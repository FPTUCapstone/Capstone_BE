name: DB migrate (Azure SQL)

# Applies database/migrations to the shared Azure SQL database after a change lands on develop.
# Runs only on push/manual dispatch (never on pull_request), so forks and unreviewed PRs
# cannot reach the credentials. The `azure-db` environment should require a reviewer and be
# limited to the develop branch (the job also checks github.ref itself).
on:
  push:
    branches: [develop]
    paths:
      - 'database/migrations/**'
      - 'database/tripmate_schema_v7.sql'
      - 'database/apply-azure.sh'
  workflow_dispatch:

concurrency:
  group: db-migrate-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    # Only the reviewed develop branch may run this job. A manual dispatch on any other branch
    # is skipped, so a branch cannot run its own modified script against the production secrets.
    if: github.repository == 'FPTUCapstone/Capstone_BE' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply schema and migrations
        env:
          AZ_SERVER: ${{ secrets.AZ_SERVER }}
          AZ_USER: ${{ secrets.AZ_USER }}
          AZ_PASS: ${{ secrets.AZ_PASS }}
        run: |
          docker run --rm \
            -v "$PWD/database:/db:ro" \
            -e AZ_SERVER -e AZ_USER -e AZ_PASS \
            mcr.microsoft.com/mssql/server:2022-latest \
            bash /db/apply-azure.sh
