services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tripmate-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # No committed default — the password comes from SA_PASSWORD in .env
      # (copy .env.example to .env). Compose fails fast with the message below if unset.
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?SA_PASSWORD must be set in .env (copy .env.example to .env)}
    ports:
      # Host-side port is intentionally not 1433: a native SQL Server instance already bound to
      # 1433 on a dev machine silently steals connections meant for this container (the request
      # fails with a confusing "Login failed for user 'sa'" instead of a connection error,
      # because two processes can both show as LISTENING on 0.0.0.0:1433 on Windows). Change
      # DB_HOST_PORT in .env if 14330 is also taken.
      - "${DB_HOST_PORT:-14330}:1433"
    volumes:
      - tripmate-sqlserver-data:/var/opt/mssql
      - ./database:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates TripMateDb (if missing), applies the full v7 schema on a fresh
  # database, and applies idempotent SQL migrations on both fresh and existing v7 DBs.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tripmate-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/scripts:ro
    environment:
      SA_PASSWORD: ${SA_PASSWORD:?SA_PASSWORD must be set in .env (copy .env.example to .env)}
    entrypoint: ["/bin/bash", "/scripts/apply-schema.sh"]
    restart: "no"

  api:
    # Explicit, stable tag — independent of the folder name Compose would otherwise derive it
    # from (<project>-api). Needed so `docker save`/`docker load` round-trips to the same name
    # on every machine, and so `docker compose up` (without --build) reuses a loaded image
    # instead of trying to rebuild it.
    image: tripmate-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripmate-api
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Built from SA_PASSWORD in .env — no committed credential.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TripMateDb;User Id=sa;Password=${SA_PASSWORD:?SA_PASSWORD must be set in .env (copy .env.example to .env)};TrustServerCertificate=True;"
      Jwt__Issuer: TripMate
      Jwt__Audience: TripMateClients
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      OPENROUTESERVICE__APIKEY: ${OPENROUTESERVICE__APIKEY:?OPENROUTESERVICE__APIKEY must be set in .env}
      OPENROUTESERVICE__BASEURL: ${OPENROUTESERVICE__BASEURL:-https://api.heigit.org/openrouteservice/}
      SchedulingRateLimit__MaxFreshGenerationsPerMinute: ${SchedulingRateLimit__MaxFreshGenerationsPerMinute:-3}
      SchedulingRateLimit__CooldownSeconds: ${SchedulingRateLimit__CooldownSeconds:-15}
      # TM-215 AI POI ranking. Windows User Secrets are unavailable inside Docker, so the
      # provider configuration must be supplied through the local, git-ignored .env file.

      AiRanking__Enabled: ${AiRanking__Enabled:-true}
      AiRanking__Endpoint: ${AiRanking__Endpoint:-https://generativelanguage.googleapis.com/v1/interactions}
      AiRanking__ApiKey: ${AiRanking__ApiKey:?AiRanking__ApiKey must be set in .env}
      AiRanking__ModelName: ${AiRanking__ModelName:-gemini-3.5-flash-lite}
      AiRanking__RateLimitPerMinute: ${AiRanking__RateLimitPerMinute:-4}
      AiRanking__MaxConcurrency: ${AiRanking__MaxConcurrency:-2}

      AiExplanation__Enabled: ${AiExplanation__Enabled:-true}
      AiExplanation__Endpoint: ${AiExplanation__Endpoint:-https://generativelanguage.googleapis.com/v1/interactions}
      AiExplanation__ApiKey: ${AiExplanation__ApiKey:?AiExplanation__ApiKey must be set in .env}
      AiExplanation__ModelName: ${AiExplanation__ModelName:-gemini-3.5-flash-lite}
      AiExplanation__TimeoutSeconds: ${AiExplanation__TimeoutSeconds:-10}
      AiExplanation__OverallTimeoutSeconds: ${AiExplanation__OverallTimeoutSeconds:-20}
      AiExplanation__MaxAttempts: ${AiExplanation__MaxAttempts:-2}
      AiExplanation__RetryBaseDelayMilliseconds: ${AiExplanation__RetryBaseDelayMilliseconds:-500}
      AiExplanation__RateLimitPerMinute: ${AiExplanation__RateLimitPerMinute:-4}
      AiExplanation__MaxConcurrency: ${AiExplanation__MaxConcurrency:-2}

      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:3005
      Cors__AllowedOrigins__2: http://localhost:3000
      EmailVerification__ContinueUrl: ${EMAIL_VERIFICATION_CONTINUE_URL}
      Firebase__ProjectId: "tripmate-82be3"
      Google__ClientId: 1015595969076-socm44rbtpnbv0o4upl88h4btesqgr6i.apps.googleusercontent.com
      # UC-06 password reset: SMTP credentials + OTP pepper come from .env — never committed.
      # Windows dotnet user-secrets do not exist inside the container, so the values are
      # passed as .NET configuration environment variables (double-underscore nesting).
      Email__Username: ${EMAIL_USERNAME:?EMAIL_USERNAME must be set in .env}
      Email__Password: ${EMAIL_PASSWORD:?EMAIL_PASSWORD must be set in .env}
      Email__FromEmail: ${EMAIL_FROM_EMAIL:?EMAIL_FROM_EMAIL must be set in .env}
      PasswordResetSecurity__OtpPepper: ${PASSWORD_RESET_OTP_PEPPER:?PASSWORD_RESET_OTP_PEPPER must be set in .env}
      # TM-207 Tour media: signed server-side Cloudinary operations. No unsigned upload preset.
      Cloudinary__CloudName: ${Cloudinary__CloudName:?Cloudinary__CloudName must be set in .env}
      Cloudinary__ApiKey: ${Cloudinary__ApiKey:?Cloudinary__ApiKey must be set in .env}
      Cloudinary__ApiSecret: ${Cloudinary__ApiSecret:?Cloudinary__ApiSecret must be set in .env}
      Cloudinary__TourMediaFolderRoot: ${Cloudinary__TourMediaFolderRoot:?Cloudinary__TourMediaFolderRoot must be set in .env}
      TourMediaCleanup__PollInterval: ${TourMediaCleanup__PollInterval:-00:00:30}
      TourMediaCleanup__LeaseDuration: ${TourMediaCleanup__LeaseDuration:-00:02:00}
      TourMediaCleanup__BatchSize: ${TourMediaCleanup__BatchSize:-20}
      # Firebase Admin service-account JSON (never committed — see .env.example / README §9).
      # Put the file at ./secrets/tripmate-firebase-admin.json on the host. If it is missing,
      # Firebase Admin initialization is unavailable and Firebase ID-token authentication
      # fails closed (tokens are rejected) — the API still boots.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/tripmate-firebase-admin.json
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "5000:8080"

volumes:
  tripmate-sqlserver-data:
